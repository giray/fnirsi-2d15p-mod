name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Byte-compile tools
        run: python -m py_compile tools/*.py
      - name: Repository checks (no firmware needed)
        run: python tools/check_repo.py
      - name: Shell syntax
        run: bash -n tools/build_all.sh
